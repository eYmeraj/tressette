# Cloudflare Worker that stores hands shared from the game. Setup: worker/README.md.
name = "tressette-hands"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ALLOWED_ORIGINS = "https://eymeraj.github.io,http://localhost:5173"

[[d1_databases]]
binding = "DB"
database_name = "tressette-hands"
# From `npx wrangler d1 create tressette-hands` (not secret: using it needs the account's credentials).
database_id = "55ac663e-1e45-4878-a41a-7fd98d3c7599"
